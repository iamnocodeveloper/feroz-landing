server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # `/privacidad` works as well as `/privacidad.html`, so a link that omits the
    # extension still lands on the page instead of a 404.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # The two images are the only heavy assets; everything else is text.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Security headers ---------------------------------------------------
    #
    # The landing is static and has no inline scripts or styles (the WhatsApp and
    # legal code lives in `assets/*.js` and `legal.js`), which is what allows a
    # strict `script-src 'self'` and `style-src 'self'`. Adding an inline <script>
    # later will break the page until it moves to a file — that is the point.
    #
    # `connect-src` names the one backend the legal pages fetch from.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://vmuvsp6s.us-east.insforge.app; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # One year, no `includeSubDomains` yet: `www` still has no DNS record and
    # locking the apex before it exists would be a trap for the browser cache.
    add_header Strict-Transport-Security "max-age=31536000" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
